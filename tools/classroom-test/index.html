<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba Classroom — Nexo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  button { font-size: 1rem; padding: .6rem 1rem; cursor: pointer; }
  #estado { margin: 1rem 0; padding: .75rem 1rem; border-radius: 8px; background: #eef; }
  #estado.error { background: #fee; }
  #estado.ok { background: #efe; }
  li { margin: .25rem 0; }
  small { color: #555; }
</style>
</head>
<body>
<h1>Prueba de Classroom</h1>
<p>Esta página solo pregunta: <b>¿puedo ver los nombres de mis cursos?</b> No guarda nada y no toca Nexo.</p>
<button id="conectar" disabled>Conectar con Google</button>
<div id="estado">Cargando…</div>
<ul id="cursos"></ul>
<small>Permiso pedido: <code>classroom.courses.readonly</code> (solo lectura). El permiso vive solo en esta pestaña.</small>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="iniciar()"></script>
<script>
  const SCOPE = 'https://www.googleapis.com/auth/classroom.courses.readonly';
  const estado = document.getElementById('estado');
  const boton = document.getElementById('conectar');
  const lista = document.getElementById('cursos');
  let cliente = null;

  function decir(texto, clase) { estado.textContent = texto; estado.className = clase || ''; }

  function iniciar() {
    const id = window.CLASSROOM_TEST_CLIENT_ID;
    if (!id || id.startsWith('PEGA_AQUI')) {
      decir('Falta el ID de cliente: pégalo en tools/classroom-test/config.js y recarga.', 'error');
      return;
    }
    cliente = google.accounts.oauth2.initTokenClient({
      client_id: id,
      scope: SCOPE,
      callback: alRecibirPermiso,
      error_callback: (e) => decir('No se pudo abrir el permiso: ' + (e.type || e.message || 'error desconocido') + '. Si cerraste la ventana, intenta de nuevo.', 'error')
    });
    boton.disabled = false;
    decir('Listo. Presiona "Conectar con Google".');
  }

  boton.addEventListener('click', () => { decir('Esperando tu permiso en la ventana de Google…'); cliente.requestAccessToken(); });

  async function alRecibirPermiso(respuesta) {
    if (respuesta.error) {
      decir('Google respondió con error: ' + respuesta.error + (respuesta.error_description ? ' — ' + respuesta.error_description : ''), 'error');
      return;
    }
    decir('Permiso recibido. Pidiendo tus cursos…');
    try {
      const r = await fetch('https://classroom.googleapis.com/v1/courses?studentId=me&courseStates=ACTIVE&pageSize=50', {
        headers: { Authorization: 'Bearer ' + respuesta.access_token }
      });
      const datos = await r.json();
      if (!r.ok) {
        decir('Classroom respondió ' + r.status + ': ' + ((datos.error && datos.error.message) || 'sin detalle'), 'error');
        return;
      }
      const cursos = datos.courses || [];
      lista.replaceChildren(...cursos.map((c) => { const li = document.createElement('li'); li.textContent = c.name + (c.section ? ' · ' + c.section : ''); return li; }));
      decir(cursos.length ? 'Funciona: ' + cursos.length + ' curso(s) activo(s).' : 'Conectó bien, pero no hay cursos activos.', 'ok');
    } catch (e) {
      decir('Error de red al consultar Classroom: ' + e.message, 'error');
    }
  }
</script>
</body>
</html>
