<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascotas en Rive</title>
<style>
  :root { --bg:#1f1a15; --ink:#f4e8d2; --muted:#c3b291; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 Georgia, serif; padding:20px 16px; }
  h1 { margin:0 0 4px; font-size:24px; } p { color:var(--muted); margin:0 0 14px; }
  .stage { max-width:900px; aspect-ratio:400/380; border-radius:12px; overflow:hidden; background:#f6ecd8; }
  canvas { width:100%; height:100%; display:block; }
  .controls { display:flex; gap:8px; margin:0 0 12px; } button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid #6b5a40; background:#2b241d; color:var(--ink); cursor:pointer; }
</style>
</head>
<body>
<h1>Mascotas en Rive · prueba</h1>
<p>Animación real compilada con la Rive CLI (<code>tools/mascots/build.cjs</code>).</p>
<div class="controls"><button data-especie="Velociraptor">Velociraptor</button><button data-especie="Capibara">Capibara</button><button data-especie="Zorro">Zorro</button></div>
<div class="controls"><button data-accion="0">Quieto</button><button data-accion="1">Caminar</button><button data-accion="2">Alcanzar libro</button><button data-accion="3">Celebrar</button></div>
<div class="stage"><canvas id="c" width="800" height="760"></canvas></div>
<script src="../vendor/rive/rive.js"></script>
<script>
  rive.RuntimeLoader.setWasmUrl('../vendor/rive/rive.wasm');
  // Cambia de especie creando de nuevo el reproductor con otro artboard del mismo .riv.
  function cargar(especie) {
    window.mascota?.cleanup();
    window.mascota = new rive.Rive({ src: '../assets/mascotas/mascotas.riv?v=' + Date.now(), canvas: document.getElementById('c'),
      artboard: especie, stateMachines: 'Mascota', autoplay: true, onLoad: () => window.mascota.resizeDrawingSurfaceToCanvas(),
      onLoadError: e => document.body.insertAdjacentHTML('beforeend', '<p style="color:#f88">No cargó: ' + e + '</p>') });
  }
  cargar('Velociraptor');
  // accion: 0 quieto (baile) · 1 caminar · 2 alcanzar · 3 celebrar (entrada de la máquina de estados "Mascota").
  document.addEventListener('click', e => {
    if (e.target.dataset.especie) return cargar(e.target.dataset.especie);
    const v = e.target.dataset.accion; if (v === undefined) return;
    const input = window.mascota.stateMachineInputs('Mascota').find(i => i.name === 'accion');
    if (input) input.value = Number(v);
  });
</script>
</body>
</html>
