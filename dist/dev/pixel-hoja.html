<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascotas pixel · hoja</title>
<style>
  body { margin:0; background:#1f1a15; color:#f4e8d2; font:15px/1.4 Georgia, serif; padding:20px 16px; }
  h1 { margin:0 0 12px; font-size:24px; } h2 { margin:18px 0 8px; font-size:18px; color:#e8b65a; }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  figure { margin:0; background:#e9d9b4; border-radius:8px; padding:4px; text-align:center; }
  figcaption { color:#3b2418; font-size:12px; font-weight:bold; }
  canvas { image-rendering:pixelated; display:block; }
</style>
</head>
<body>
<h1>Mascotas en pixel art · hoja de revisión (×6)</h1>
<div id="out"></div>
<script src="pixelmascotas.js?v=6"></script>
<script>
const P = window.PixelMascotas, out = document.getElementById('out');
const base = { t: 1.3, sx: 1, sy: 1, bodyTilt: 0, rootTilt: 0, hop: 0, lift: 2, slosh: 0, cork: 0, tag: 0, footL: 0, footR: 0, spin: 0, excite: 0, drip: 0, hat: 0, look: [0, 0], blink: false, expr: 'neutral', outfit: {} };
function fig(kind, st, label, scale = 6) {
  const c = document.createElement('canvas'); c.width = P.W; c.height = P.H; c.style.width = P.W * scale + 'px'; c.style.height = P.H * scale + 'px';
  P.render(c.getContext('2d'), kind, { ...base, ...st });
  const f = document.createElement('figure'); f.append(c); f.insertAdjacentHTML('beforeend', `<figcaption>${label}</figcaption>`); return f;
}
const section = (title, items) => { out.insertAdjacentHTML('beforeend', `<h2>${title}</h2>`); const r = document.createElement('div'); r.className = 'row'; items.forEach(i => r.append(i)); out.append(r); };
section('Las tres', P.list.map(([k, l]) => fig(k, {}, l, 8)));
P.list.forEach(([k, l]) => section(l + ' · expresiones', P.EXPRESSIONS.map(e => fig(k, { expr: e }, e, 3))));
P.list.forEach(([k, l]) => section(l + ' · cosméticos', Object.keys(P.ACCESORIOS).map(id => fig(k, { outfit: { x: id } }, P.NOMBRES[id], 3))));
P.list.forEach(([k, l]) => section(l + ' · brazos', ['rest','sixseven','dab','wave','dance','up','carry','read','cry','fists','fiddle','scratch','cheeks','sleep'].map(p => fig(k, { arms: P.armPose(p, .1), expr: p === 'dab' ? 'feliz' : p === 'sixseven' ? 'picara' : 'neutral', bodyTilt: p === 'dab' ? -10 : 0 }, p, 4))));
section('Poses (matraz)', [fig('matraz', { sx: 1.12, sy: .86 }, 'aplastado', 4), fig('matraz', { sx: .92, sy: 1.1 }, 'estirado', 4), fig('matraz', { bodyTilt: 8, slosh: -12 }, 'inclinado', 4), fig('matraz', { cork: 4 }, 'corcho', 4)]);
</script>
</body>
</html>
